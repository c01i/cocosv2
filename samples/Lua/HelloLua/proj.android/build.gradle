plugins {
    id 'com.android.application' version '8.10.1'
}

android {
    namespace 'org.cocos2dx.hellolua'
    compileSdk 36
    buildToolsVersion "36.0.0"
    ndkVersion '28.0.13004108'

    defaultConfig {
        applicationId 'org.cocos2dx.hellolua'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
                targets 'hellolua'
            }
        }
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
    externalNativeBuild {
        cmake {
            path '../CMakeLists.txt'
            version '3.22.1'
        }
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src', '../../../../cocos2dx/platform/android/java/src']
            res.srcDirs = ['res']
            assets.srcDirs = ['../Resources', 'notices']
        }
    }
}
